name: TEVV22 TFDV Exact C++ Native Tests
on:
  push:
    branches: [tevv22-public-asset-acquisition]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Clone exact TFDV release
        shell: bash
        run: |
          set -euo pipefail
          git clone --branch v1.21.0 --depth 1 https://github.com/tensorflow/data-validation.git upstream-tfdv
          cd upstream-tfdv
          test "$(git rev-parse HEAD)" = "933dc6bcc0b7014c25522819095cd227242d0b56"
          test "$(git hash-object tensorflow_data_validation/anomalies/schema_anomalies_test.cc)" = "0c2f4816d40b0ddfe9fe3ff5c158ffa9ba60daa2"
          cat .bazelversion
      - name: Run exact upstream native gtests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/tevv22-tfdv-cpp
          cd upstream-tfdv
          set +e
          bazel test //tensorflow_data_validation/anomalies:schema_anomalies_test \
            --test_filter='SchemaAnomalies.FindsLowSupportedImageFraction:SchemaAnomalies.UniqueNotInRange' \
            --test_output=all \
            > ../evidence/tevv22-tfdv-cpp/bazel.stdout 2> ../evidence/tevv22-tfdv-cpp/bazel.stderr
          RC=$?
          set -e
          printf '%s\n' "$RC" > ../evidence/tevv22-tfdv-cpp/exit_code.txt
          cat ../evidence/tevv22-tfdv-cpp/bazel.stdout
          cat ../evidence/tevv22-tfdv-cpp/bazel.stderr >&2
          test "$RC" -eq 0
      - name: Record evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib,pathlib,platform
          root=pathlib.Path("evidence/tevv22-tfdv-cpp")
          out={
            "schema":"AIPF-TEVV22-TFDV-CPP-NATIVE-REPLAY-1",
            "items":["AIPF-000195","AIPF-000205"],
            "release":{"tag":"v1.21.0","commit":"933dc6bcc0b7014c25522819095cd227242d0b56"},
            "native_fixture":{"path":"tensorflow_data_validation/anomalies/schema_anomalies_test.cc","blob_sha":"0c2f4816d40b0ddfe9fe3ff5c158ffa9ba60daa2"},
            "target":"//tensorflow_data_validation/anomalies:schema_anomalies_test",
            "test_filter":"SchemaAnomalies.FindsLowSupportedImageFraction:SchemaAnomalies.UniqueNotInRange",
            "exit_code":int((root/"exit_code.txt").read_text().strip()),
            "stdout_sha256":hashlib.sha256((root/"bazel.stdout").read_bytes()).hexdigest(),
            "stderr_sha256":hashlib.sha256((root/"bazel.stderr").read_bytes()).hexdigest(),
            "runner":platform.platform(),
            "acceptance_criterion_lowered":False
          }
          (root/"native_replay.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
          sha256sum evidence/tevv22-tfdv-cpp/* > evidence/tevv22-tfdv-cpp/files.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: tevv22-tfdv-cpp-native-replay
          retention-days: 7
          path: evidence/tevv22-tfdv-cpp/
