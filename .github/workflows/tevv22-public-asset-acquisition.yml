name: TEVV22 RHA Runtime Diagnostic
on:
  push:
    branches: [tevv22-public-asset-acquisition]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Clone frozen upstream
        run: |
          git clone https://github.com/Yonas650/RewardHackingAgents.git upstream-rha
          cd upstream-rha
          git checkout 9ea7cdc8dde6c89b1ea75e2ba86a61ffff72eb34
          test "$(git rev-parse HEAD)" = "9ea7cdc8dde6c89b1ea75e2ba86a61ffff72eb34"
      - name: Install minimum upstream dependencies
        run: python -m pip install --disable-pip-version-check --quiet numpy pandas scikit-learn xgboost joblib
      - name: Execute untouched clean credit-risk scripts and preserve diagnostics
        shell: bash
        run: |
          set -u
          cd upstream-rha
          export PYTHONPATH="$PWD"
          mkdir -p ../evidence/tevv22-rha-diagnostic/workspace
          cp -R rha/tasks/credit_risk/workspace_template/clean/. ../evidence/tevv22-rha-diagnostic/workspace/
          W="$PWD/../evidence/tevv22-rha-diagnostic/workspace"
          set +e
          (cd "$W" && python src/train_model.py) > ../evidence/tevv22-rha-diagnostic/train.stdout 2> ../evidence/tevv22-rha-diagnostic/train.stderr
          TRAIN_RC=$?
          (cd "$W" && python src/evaluate.py) > ../evidence/tevv22-rha-diagnostic/eval.stdout 2> ../evidence/tevv22-rha-diagnostic/eval.stderr
          EVAL_RC=$?
          (cd "$W" && python src/metrics_ref.py) > ../evidence/tevv22-rha-diagnostic/ref.stdout 2> ../evidence/tevv22-rha-diagnostic/ref.stderr
          REF_RC=$?
          set -e
          python - <<PY
          import json,platform,sys,xgboost,sklearn,pandas,numpy,pathlib
          root=pathlib.Path("../evidence/tevv22-rha-diagnostic")
          out={
            "upstream_commit":"9ea7cdc8dde6c89b1ea75e2ba86a61ffff72eb34",
            "runtime":{"python":sys.version,"platform":platform.platform(),"xgboost":xgboost.__version__,"sklearn":sklearn.__version__,"pandas":pandas.__version__,"numpy":numpy.__version__},
            "returncodes":{"train":int("$TRAIN_RC"),"eval":int("$EVAL_RC"),"ref":int("$REF_RC")},
            "stdout":{k:(root/f"{k}.stdout").read_text(errors="replace") for k in ["train","eval","ref"]},
            "stderr":{k:(root/f"{k}.stderr").read_text(errors="replace") for k in ["train","eval","ref"]},
          }
          (root/"diagnostic.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tevv22-rha-runtime-diagnostic
          retention-days: 7
          path: evidence/tevv22-rha-diagnostic/
