name: TEVV22 CodeHalu Full Schema Audit
on:
  push:
    branches: [tevv22-public-asset-acquisition]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Acquire all frozen CodeHaluEval files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/tevv22-codehalu
          HF_SHA="$(git ls-remote https://huggingface.co/datasets/Yuchen111/CodeHaluEval refs/heads/main | awk '{print $1}')"
          test -n "$HF_SHA"
          printf '%s\n' "$HF_SHA" > evidence/tevv22-codehalu/hf_commit.txt
          files=(
            calculate_boundary_hallucination.json
            data_compliance_hallucination.json
            external_source_hallucination.json
            identification_hallucination.json
            logic_breakdown.json
            logic_deviation.json
            physical_constraint_hallucination.json
            structural_access_hallucination.json
          )
          for f in "${files[@]}"; do
            curl -L --fail --retry 3 --retry-delay 2 \
              "https://huggingface.co/datasets/Yuchen111/CodeHaluEval/resolve/$HF_SHA/$f" \
              -o "evidence/tevv22-codehalu/$f"
          done
          sha256sum evidence/tevv22-codehalu/*.json > evidence/tevv22-codehalu/files.sha256
      - name: Inspect all schemas and prediction-field availability
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib,pathlib,collections
          root=pathlib.Path("evidence/tevv22-codehalu")
          fields=["deal_response","input_output","response","full_response","code","model_output","prediction","pred","error_type","id","prompt","input","output","halu_type"]
          out={"hf_commit":(root/"hf_commit.txt").read_text().strip(),"files":{}}
          for p in sorted(root.glob("*.json")):
              obj=json.loads(p.read_text(encoding="utf-8"))
              rows=obj if isinstance(obj,list) else [obj]
              first=rows[0] if rows and isinstance(rows[0],dict) else {}
              counts={k:sum(1 for r in rows if isinstance(r,dict) and k in r and r[k] not in (None,"",[])) for k in fields}
              halu=collections.Counter(str(r.get("halu_type")) for r in rows if isinstance(r,dict) and r.get("halu_type") not in (None,""))
              out["files"][p.name]={
                  "sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
                  "bytes":p.stat().st_size,
                  "top_level_type":type(obj).__name__,
                  "row_count":len(rows),
                  "first_row_keys":sorted(first.keys()),
                  "fields_of_interest_nonempty":counts,
                  "halu_type_counts":dict(sorted(halu.items()))
              }
          pred_fields=["deal_response","response","full_response","code","model_output","prediction","pred"]
          out["aggregate"]={
              "file_count":len(out["files"]),
              "total_rows":sum(v["row_count"] for v in out["files"].values()),
              "files_with_any_prediction_field":[
                  name for name,v in out["files"].items()
                  if any(v["fields_of_interest_nonempty"].get(k,0)>0 for k in pred_fields)
              ],
              "prediction_fields_checked":pred_fields
          }
          (root/"full_schema_summary.json").write_text(json.dumps(out,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          print(json.dumps(out,indent=2,ensure_ascii=False))
          PY
      - name: Upload audit summary and hashes
        uses: actions/upload-artifact@v4
        with:
          name: tevv22-codehalu-full-schema
          retention-days: 7
          path: |
            evidence/tevv22-codehalu/hf_commit.txt
            evidence/tevv22-codehalu/files.sha256
            evidence/tevv22-codehalu/full_schema_summary.json
